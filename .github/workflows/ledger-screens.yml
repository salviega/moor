# Renders the six signatures of the flow on an emulated Ledger Flex with our
# ERC-7730 descriptors injected (packages/erc7730/scripts/screens.mjs) and fails
# if a descriptor-covered transaction is not clear-signed or a screen changed.
#
# Manual only: it clones and builds LedgerHQ/device-sdk-ts and pulls a 1.4 GB
# Speculos image (~8 minutes). Run it from the Actions tab when a descriptor
# changes; the committed screens under packages/erc7730/screens/ are the
# evidence in between (AGENTS.md, ritual step 4).
name: ledger-screens

on:
  workflow_dispatch:

jobs:
  ledger-screens:
    name: ledger:screens · Speculos renders every signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Ledger's clear-signing tester (device-sdk-ts) needs Node 24; the rest of the repo runs on .nvmrc.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker pull ghcr.io/ledgerhq/speculos:latest
      - run: pnpm ledger:screens
        env:
          GH_TOKEN: ${{ github.token }}
      - run: git diff --exit-code --stat -- packages/erc7730/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-screens
          path: packages/erc7730/screens
